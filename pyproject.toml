[project]
name = "trace-fraud-workbench"
version = "1.0.0"
description = "Evidence-driven fraud investigations with policy-controlled decisions"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "python-dotenv>=1,<2",
    "mcp>=1.9,<2",
    "tigergraph-mcp>=0.1",
    "scikit-learn>=1.7,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/tracework"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.coverage.run]
source = ["backend/tracework"]

[tool.coverage.report]
skip_empty = true

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
